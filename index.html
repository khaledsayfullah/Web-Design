<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Design</title>
    <!-- Google fonts start here============= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- google fonts end here=============== -->

    <!-- Font awesome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- font awesome link end -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- header part start here -->
    <section id="headerPart">
      <div class="container">
        <div class="heading">
          <div class="headingleft">
            <div class="navbar">
              <img src="./images/logo.png" alt="logo" />
            </div>
            <div class="menulist">
              <ul>
                <li>
                  <a href="#"
                    >Products <i class="fa-solid fa-angle-down"></i
                  ></a>
                </li>
                <li>
                  <a href="#"
                    >Button CTA <i class="fa-solid fa-angle-down"></i
                  ></a>
                </li>
                <li>
                  <a href="#">Pricing </a>
                </li>
                <li>
                  <a href="#">Blog</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="headerRight">
            <a href="#">Log in</a>
            <div class="navBtn">
                <button>
              <a href="#">
                <img src="./images/navbtnlogo.png" alt="" />
                <p>try for free</p>
              </a>
            </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- header part end here -->

    <!-- banner part start here -->

<section id="bannerPart">
    <div class="container">
        <div class="banner">
            <div class="bannerHeading">
                <button>
                    <a href="#">New feature</a>
                </button>
                <p>Check out the team dashboard</p>
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </div>
    </div>
</section>

    <!-- banner part end here -->
  </body>
</html>
